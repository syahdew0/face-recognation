<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Phyton</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      color: #333;
    }

    #demo {
      margin-top: 10px;
      color: #e74c3c;
      font-weight: bold;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    video, canvas {
      border: 2px solid #3498db;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    #snap {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #snap:hover {
      background-color: #2980b9;
    }

    .flex-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
  </style>
</head>
<body>
  <h1>Camera Capture</h1>
  <button id="snap">Kirim</button>
  <div id="demo"></div>
  <div class="container">
    <div>
      <video id="video" width="320" height="240" autoplay></video>
    </div>
    <div>
      <canvas id="canvas" width="640" height="480"></canvas>
    </div>
  </div>

  <script type="">
    // Grab elements, create settings, etc.
    var video = document.getElementById('video');

    // Get access to the camera!
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(function (stream) {
        video.srcObject = stream;
        video.play();
      });
    }

    // Elements for taking the snapshot
    var canvas = document.getElementById('canvas');
    var context = canvas.getContext('2d');
    var demo = document.getElementById("demo");

    // Trigger photo take
    document.getElementById("snap").addEventListener("click", function () {
      takepicture()
    });

    function takepicture() {
      demo.innerHTML = "Memproses....";
      context.drawImage(video, 0, 0, 640, 480);
      const data = canvas.toDataURL("image/png", 1.0);
      const xhttp = new XMLHttpRequest();
      var fd = new FormData();
      fd.append('image', data);
      xhttp.onload = function () {
        const response = JSON.parse(this.responseText);
        if (response.status === 'success') {
          window.location.href = `http://localhost:8000/test?status=success&name=${response.name}`;
        } else {
          demo.innerHTML = response.message;
        }
      }
      xhttp.open("POST", "http://localhost:5000/");
      xhttp.send(fd);
    }
  </script>
</body>
</html>
